<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
</head>

<body>

    <h1>Fake News Detector</h1>

    <form method="POST">

        <textarea
            name="news"
            rows="5"
            cols="50"></textarea>

        <br><br>

        <button type="submit">
            Check News
        </button>

    </form>

    <h2>{{ prediction }}</h2>

</body>
</html>
